[project]
name = "bluebook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bluebook-core", "bluebook-perception", "bluebook-teach", "bluebook-interactive"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bluebook-core = { workspace = true }
bluebook-perception = { workspace = true }
bluebook-teach = { workspace = true }
bluebook-interactive = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx2"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
