name: BluebookCamera
options:
  bundleIdPrefix: com.rishabhroy.bluebook
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3Y435S5YAR
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  BluebookCamera:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishabhroy.bluebook.camera
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Bluebook Camera
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Streams the scene camera (and tracks the wearer's head) to your bluebook server.
        NSLocalNetworkUsageDescription: Connects to your bluebook server on the local network.
        # Dev tool: allow plain http/ws for LAN testing. The normal setup is https via `tailscale serve`.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
  BluebookCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BluebookCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rishabhroy.bluebook.camera.tests
schemes:
  BluebookCamera:
    build:
      targets:
        BluebookCamera: all
    test:
      targets: [BluebookCameraTests]
