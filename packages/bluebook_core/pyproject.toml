[project]
name = "bluebook-core"
version = "0.1.0"
description = "Shared contracts, server, model client, skill store, display helpers"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "google-genai>=1.30",
  "numpy>=2",
  "pillow>=11",
]

[project.scripts]
bluebook = "bluebook_core.cli:main"
bluebook-server = "bluebook_core.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
